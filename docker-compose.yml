version: '3.8'
services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    ports:
      - "19999:19999"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./netdata/etc/netdata:/etc/netdata:rw
      - ./netdata/var/lib/netdata:/var/lib/netdata:rw
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    restart: unless-stopped
